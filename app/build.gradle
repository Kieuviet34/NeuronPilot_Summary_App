apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.mediatek.neuropilot.jnidemo'
    compileSdkVersion 34
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId "com.mediatek.neuropilot.jnidemo.mod2"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName "2.0"
        setProperty("archivesBaseName", "neuropilotjnidemo-$versionName")
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    aaptOptions {
        noCompress 'tflite', 'model', 'dla'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testOptions {
        unitTests.all {
            maxHeapSize = "512m"
        }
    }
    sourceSets {
        main {
            // let gradle pack the shared library into apk
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    packaging {
        doNotStrip '**/*.so'
        pickFirst 'lib/arm64-v8a/libmtk_llm.so'
        pickFirst 'lib/arm64-v8a/libcommon.so'
        pickFirst 'lib/arm64-v8a/libtokenizer.so'
        pickFirst 'lib/arm64-v8a/libyaml-cpp.so'
        pickFirst 'lib/arm64-v8a/libsentencepiece.so'
        pickFirst 'lib/arm64-v8a/libhf-tokenizer.so'
        pickFirst 'lib/arm64-v8a/libre2.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++.so'
        pickFirst 'lib/arm64-v8a/libbase.so'
        pickFirst 'lib/arm64-v8a/libdmabufheap.so'
        pickFirst 'lib/arm64-v8a/libcutils.so'
        pickFirst 'lib/arm64-v8a/libapu_mdw.so'
        pickFirst 'lib/arm64-v8a/libapu_mdw_batch.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation fileTree(dir: 'jniLibs', include: ['*.so'])
    
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
}
